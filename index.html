<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Tài Khoản Roblox</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212; /* Nền tối giống ảnh */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: transparent; /* Giống style overlay trong ảnh */
            padding: 30px 20px;
            border-radius: 8px;
        }
        h2 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 30px;
            font-weight: 800;
            letter-spacing: 2px;
        }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            background-color: #1e1e1e; /* Ô input tối màu */
            border: 1px solid #333333;
            border-radius: 8px;
            font-size: 16px;
            color: #ffffff;
            box-sizing: border-box;
            outline: none;
        }
        input::placeholder {
            color: #888888;
        }
        input:focus {
            border-color: #ffffff;
        }
        button {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: none;
        }
        .btn-login {
            background-color: #ffffff; /* Nút đăng nhập màu trắng giống ảnh */
            color: #000000;
        }
        .btn-secondary {
            background-color: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
        }
        .link {
            display: block;
            text-align: center;
            color: #cccccc;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 25px;
            margin-top: 15px;
        }
        .link:hover {
            text-decoration: underline;
        }
        .divider {
            border-top: 1px solid #333333;
            margin: 20px 0;
        }
        .otp-section {
            text-align: center;
            margin-bottom: 15px;
        }
        .otp-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }
        .otp-desc {
            font-size: 14px;
            color: #aaaaaa;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>ROBLOX</h2>
        
        <form onsubmit="event.preventDefault();">
            <input type="text" placeholder="Tên người dùng/Địa chỉ email/Số điện thoại">
            <input type="password" placeholder="Mật khẩu">
            <button type="submit" class="btn-login">Đăng nhập</button>
            <button type="button" class="btn-secondary">Gửi mã một lần cho tôi qua email</button>
            <button type="button" class="btn-secondary">Đăng Nhập Nhanh</button>
        </form>
        
        <a href="#" class="link">Bạn quên Mật khẩu hoặc Tên người dùng ?</a>
        
        <div class="divider"></div>
        
        <div class="otp-section">
            <div class="otp-title">Nhập mã một lần.</div>
            <div class="otp-desc">Nhập email đã xác minh cho tài khoản của bạn để nhận quà một lần</div>
            <input type="text" placeholder="Mã một lần">
            <button type="button" class="btn-login">Tiếp tục</button>
        </div>
    </div>
</body>
</html>
